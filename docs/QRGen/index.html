<!DOCTYPE html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
  <style>
    body { background: #1b1b1b; color: #7a7a7a; font-family: "Silkscreen"; text-align: center; }
    #main { border: 5px solid gray; background: gray; width: 65vw; margin: auto; padding: 20px; box-sizing: border-box; }
    input { width: 100%; background: #4a4a4a; color: #fff; border: 2px solid #000; font-family: inherit; padding: 8px; box-sizing: border-box; }
    canvas { background: white; padding: 10px; margin-top: 20px; max-width: 90%; image-rendering: pixelated; }
  </style>
</head>
<body>
  <h2>QR Generator </h2>
  <div id="main">
    <label>Data: <input id="text" value="https://example.com" placeholder="Type text or URLs..."></label>
    <p>Here's the QR code:</p>
    <canvas id="qr"></canvas>
  </div>

  <script>
  // === SUB-2.5KB VERSION 1-40 QR ENGINE (ISO/IEC 18004) ===
  const QREngine = (()=>{
    const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
    for (let i = 0, x = 1; i < 255; i++) { EXP[i] = EXP[i + 255] = x; LOG[x] = i; x = (x << 1) ^ (x >= 128 ? 0x11d : 0); }
    const mul = (a, b) => (!a || !b) ? 0 : EXP[(LOG[a] + LOG[b]) % 255];

    function getPoly(n) {
      let p = [1];
      for (let i = 0; i < n; i++) {
        let next = new Array(p.length + 1).fill(0);
        for (let j = 0; j < p.length; j++) { next[j] ^= mul(p[j], EXP[i]); next[j + 1] ^= p[j]; }
        p = next;
      }
      return p;
    }

    function bch(val, poly, len) {
      let b = val << len;
      for (let i = 31; i >= len; i--) if (b & (1 << i)) b ^= poly << (i - len);
      return (val << len) | b;
    }

    // Formulas for V1-V40 Low-ECC block layouts without storing 160-item tables
    function getECC(v) {
      const ecWords = v < 2 ? 7 : v < 5 ? 10 : v < 8 ? 15 : v < 14 ? 20 : v < 21 ? 26 : 30;
      const totalWords = Math.floor((16 * v * v + 128 * v + 64) / 8);
      const blocks = Math.max(1, Math.round(totalWords / (ecWords + 100)));
      const dataLen = Math.floor(totalWords / blocks) - ecWords;
      return { v, totalWords, ecWords, blocks, dataLen, cap: totalWords - (blocks * ecWords) };
    }

    function getAlign(v) {
      if (v === 1) return [];
      let n = Math.floor(v / 7) + 2, s = (v * 4 + 4) / (n - 1);
      s = (s % 2 === 0) ? s : Math.ceil(s / 2) * 2;
      let pos = [6];
      for (let i = 1; i < n; i++) pos.push(v * 4 + 10 - Math.round((n - 1 - i) * s));
      return [...new Set(pos)];
    }

    return function(str) {
      const utf8 = new TextEncoder().encode(str);
      let v = 1, cfg;
      while (v <= 40) {
        cfg = getECC(v);
        let overhead = v < 10 ? 2 : 3;
        if (utf8.length + overhead <= cfg.cap) break;
        v++;
      }
      if (v > 40) return null;

      // Bitstream packing
      let bits = [0, 1, 0, 0];
      let cBits = v < 10 ? 8 : 16;
      for (let i = cBits - 1; i >= 0; i--) bits.push((utf8.length >> i) & 1);
      utf8.forEach(b => { for (let i = 7; i >= 0; i--) bits.push((b >> i) & 1); });
      while (bits.length < cfg.cap * 8 && bits.length % 8) bits.push(0);
      let bytes = [];
      for (let i = 0; i < bits.length; i += 8) bytes.push(bits.slice(i, i + 8).reduce((a, b) => (a << 1) | b));
      let pad = [0xEC, 0x11], p = 0;
      while (bytes.length < cfg.cap) bytes.push(pad[p++ % 2]);

      // RS Interleaving
      let poly = getPoly(cfg.ecWords);
      let rawB = [], ecB = [];
      let bLen = Math.floor(bytes.length / cfg.blocks);
      for (let i = 0; i < cfg.blocks; i++) {
        let b = bytes.slice(i * bLen, (i + 1) * bLen);
        rawB.push(b);
        let ec = new Uint8Array(cfg.ecWords), msg = new Uint8Array([...b, ...ec]);
        for (let j = 0; j < b.length; j++) {
          let c = msg[j];
          if (c) for (let k = 0; k < poly.length; k++) msg[j + k] ^= mul(poly[k], c);
        }
        ecB.push(msg.slice(b.length));
      }

      let interleaved = [];
      for (let i = 0; i < bLen; i++) for (let b = 0; b < cfg.blocks; b++) interleaved.push(rawB[b][i]);
      for (let i = 0; i < cfg.ecWords; i++) for (let b = 0; b < cfg.blocks; b++) interleaved.push(ecB[b][i]);

      // Matrix generation
      let S = v * 4 + 17;
      let grid = Array(S).fill(0).map(() => Array(S).fill(null));
      const set = (r, c, val) => { if (r >= 0 && r < S && c >= 0 && c < S) grid[r][c] = val; };

      // Finders
      const putFinder = (r, c) => {
        for (let y = -1; y <= 7; y++) for (let x = -1; x <= 7; x++) {
          if (r + y >= 0 && r + y < S && c + x >= 0 && c + x < S) {
            let out = (y === -1 || y === 7 || x === -1 || x === 7);
            let edge = (y === 0 || y === 6 || x === 0 || x === 6);
            let mid = (y >= 2 && y <= 4 && x >= 2 && x <= 4);
            set(r + y, c + x, !out && (edge || mid) ? 1 : 0);
          }
        }
      };
      putFinder(0, 0); putFinder(0, S - 7); putFinder(S - 7, 0);

      // Alignment Patterns
      let aPos = getAlign(v);
      for (let y of aPos) for (let x of aPos) {
        if (grid[y][x] !== null) continue;
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
          set(y + dy, x + dx, Math.max(Math.abs(dy), Math.abs(dx)) !== 1 ? 1 : 0);
      }

      // Timing tracks
      for (let i = 8; i < S - 8; i++) {
        if (grid[6][i] === null) set(6, i, i % 2 === 0 ? 1 : 0);
        if (grid[i][6] === null) set(i, 6, i % 2 === 0 ? 1 : 0);
      }
      set(4 * v + 9, 8, 1);

      // Version Information (Versions 7..40)
      if (v >= 7) {
        let vBits = bch(v, 0x1F25, 12);
        for (let i = 0; i < 18; i++) {
          let b = (vBits >> i) & 1;
          set(Math.floor(i / 3), S - 11 + (i % 3), b);
          set(S - 11 + (i % 3), Math.floor(i / 3), b);
        }
      }

      // Format Bits (Fixed Level L, Mask 0)
      let fBits = bch(0, 0x537, 10) ^ 0x5412;
      for (let i = 0; i < 15; i++) {
        let b = (fBits >> i) & 1;
        if (i < 6) set(8, i, b); else if (i < 8) set(8, i + 1, b); else set(14 - i, 8, b);
        if (i < 8) set(S - 1 - i, 8, b); else set(8, S - 15 + i, b);
      }

      // Fill Data & Mask 0 ((row + col) % 2 === 0)
      let flat = [];
      interleaved.forEach(byte => { for (let i = 7; i >= 0; i--) flat.push((byte >> i) & 1); });
      let fIdx = 0;
      for (let right = S - 1; right > 0; right -= 2) {
        if (right === 6) right--;
        for (let vert = 0; vert < S; vert++) {
          for (let col = right; col > right - 2; col--) {
            let row = ((right + 1) & 2) ? S - 1 - vert : vert;
            if (grid[row][col] === null) {
              let bit = fIdx < flat.length ? flat[fIdx++] : 0;
              set(row, col, bit ^ (((row + col) % 2 === 0) ? 1 : 0));
            }
          }
        }
      }
      return { size: S, grid };
    };
  })();

  // UI Controller
  const input = document.getElementById("text");
  const canvas = document.getElementById("qr");
  const ctx = canvas.getContext("2d");

  function draw() {
    const data = input.value.trim() || " ";
    const qr = QREngine(data);
    if (!qr) return;
    const scale = Math.max(2, Math.floor(320 / qr.size));
    canvas.width = canvas.height = qr.size * scale;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < qr.size; y++) {
      for (let x = 0; x < qr.size; x++) {
        ctx.fillStyle = qr.grid[y][x] ? "#000" : "#fff";
        ctx.fillRect(x * scale, y * scale, scale, scale);
      }
    }
  }

  input.addEventListener("input", draw);
  draw();
  </script>
</body>
</html>
