<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Playground</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: rgb(27, 27, 27);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: "Silkscreen", sans-serif;
        }

        h2 {
            color: rgb(122, 122, 122);
            text-align: center;
            font-weight: 700;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .silkscreen-regular {
            font-family: "Silkscreen", sans-serif;
            font-weight: 400;
        }

        .silkscreen-bold {
            font-family: "Silkscreen", sans-serif;
            font-weight: 700;
        }

        #main {
            border: 5px solid gray;
            border-radius: 5px;
            width: 600px;
            max-width: 95vw;
            background: gray;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #apiKey,
        #model,
        #prompt {
            border: 2px solid rgb(0, 0, 0);
            background: rgb(74, 74, 74);
            color: rgb(202, 202, 202);
            font-family: "Silkscreen", sans-serif;
            padding: 8px;
            outline: none;
        }

        #apiKey {
            flex: 1;
        }

        #model {
            cursor: pointer;
        }

        #prompt {
            width: 100%;
            height: 100px;
            resize: vertical;
        }

        #prompt::placeholder,
        #apiKey::placeholder {
            font-family: "Silkscreen", sans-serif;
            color: rgb(150, 150, 150);
        }

        #send {
            background: rgb(74, 74, 74);
            color: rgb(202, 202, 202);
            border: 2px solid black;
            padding: 10px 24px;
            font-family: "Silkscreen", sans-serif;
            cursor: pointer;
            align-self: flex-start;
        }

        #send:hover:not(:disabled) {
            background: rgb(90, 90, 90);
        }

        #send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #response {
            width: 100%;
            min-height: 150px;
            max-height: 300px;
            border: 2px solid black;
            background: rgb(74, 74, 74);
            color: rgb(202, 202, 202);
            font-family: "Silkscreen", sans-serif;
            padding: 10px;
            overflow-y: auto;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

    <h2>Gemini AI Playground</h2>

    <div id="main">
        <div class="field-row">
            <label class="silkscreen-regular" for="apiKey">API Key:</label>
            <input id="apiKey" type="password" placeholder="API key">
        </div>

        <div class="field-row">
            <label class="silkscreen-regular" for="model">Model:</label>
            <select id="model">
                <option value="gemini-3.6-flash" selected>gemini-3.6-flash</option>
                <option value="gemini-1.5-flash">gemini-1.5-flash</option>
                <option value="gemini-1.5-pro">gemini-1.5-pro</option>
                <option value="gemini-3.5-flash">gemini-3.5-flash</option>
                <option value="gemini-3.8-flash">gemini-3.8-flash</option>
                <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
                <option value="gemini-3.5-flash">gemini-3.5-flash</option>
            </select>
        </div>

        <div class="field-group">
            <label class="silkscreen-bold" for="prompt">Prompt:</label>
            <textarea id="prompt" placeholder="Enter your prompt..."></textarea>
        </div>

        <button id="send">Send</button>

        <div id="response">Response will appear here.</div>
    </div>

<script>
    const responseBox = document.getElementById("response");
    const promptInput = document.getElementById("prompt");
    const modelSelect = document.getElementById("model");
    const apiKeyInput = document.getElementById("apiKey");
    const sendBtn = document.getElementById("send");

    async function postData(url, payload) {
        const response = await fetch(url, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });
        return await response.json();
    }

    sendBtn.addEventListener("click", async () => {
        const apiKey = apiKeyInput.value.trim();
        const model = modelSelect.value;
        const promptText = promptInput.value.trim();

        if (!apiKey) {
            alert("API key is required.");
            return;
        }

        if (!model) {
            alert("Please select a model.");
            return;
        }

        if (!promptText) {
            alert("Prompt cannot be empty.");
            return;
        }

        if (promptText.length > 8192) {
            alert("Prompt is too long.");
            return;
        }

        sendBtn.disabled = true;
        sendBtn.innerText = "Generating...";
        responseBox.innerText = "Loading response...";

        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
        const payload = {
            contents: [
                {
                    parts: [
                        { text: promptText }
                    ]
                }
            ]
        };

        try {
            const data = await postData(endpoint, payload);

            if (data.error) {
                responseBox.innerText = `API Error: ${data.error.message || "Unknown error occurred"}`;
            } else if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
                responseBox.innerText = data.candidates[0].content.parts[0].text;
            } else {
                responseBox.innerText = "No text returned from the model.";
            }
        } catch (err) {
            responseBox.innerText = `Network/Execution Error: ${err.message}`;
        } finally {
            sendBtn.disabled = false;
            sendBtn.innerText = "Send";
        }
    });
</script>

</body>
</html>
