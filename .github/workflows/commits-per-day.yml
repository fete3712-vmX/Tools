name: Update Commit Badge

on:
  push:
    branches:
      - main
  schedule:
    # Runs at 00:00 UTC daily (adjust hour if you want your local midnight)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI for testing

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Commits Today
        id: count
        run: |
          export TZ="Europe/Warsaw"
          TODAY=$(date +'%Y-%m-%d')

          COUNT=$(git log --since="$TODAY 00:00:00" --until="$TODAY 23:59:59" \
            --invert-grep --author="github-actions" --oneline | wc -l | tr -d ' ')

          echo "commits=$COUNT" >> $GITHUB_OUTPUT
          echo "Found $COUNT commit(s) today ($TODAY)."

      - name: Update README
        run: |
          COMMITS=${{ steps.count.outputs.commits }}

          # Matches badges like: https://img.shields.io/badge/commits_today-<ANY_NUMBER>-blue
          sed -E -i "s|(https://img\.shields\.io/badge/commits[_%20]today-)[0-9]+(-blue)|\1${COMMITS}\2|g" README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore: update daily commit badge [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes in badge count. Skipping commit."
          fi
