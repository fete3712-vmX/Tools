name: Update Commit Badge

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Commits Today
        id: count
        run: |
          TODAY=$(date +'%Y-%m-%d')
          COUNT=$(git log --since="$TODAY 00:00:00" --until="$TODAY 23:59:59" --invert-grep --author="github-actions" --oneline | wc -l)
          echo "commits=$COUNT" >> $GITHUB_OUTPUT

      - name: Update README
        run: |
          COMMITS=${{ steps.count.outputs.commits }}
          sed -i 's|<img src="https://shields.io[0-9]*-blue" alt="Commits Today">|<img src="https://shields.io'"$COMMITS"'-blue" alt="Commits Today">|g' README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update daily commit badge" && git push)
          
