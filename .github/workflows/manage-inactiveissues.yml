name: Manage Inactive Issues

on:
  schedule:
    - cron: '30 5 * * *'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale-issues:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Detect issues attached to a project board and label them
      - name: Sync Project labels
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const query = `
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  issues(first: 100, states: [OPEN]) {
                    nodes {
                      number
                      labels(first: 50) {
                        nodes { name }
                      }
                      projectItems(first: 1) {
                        totalCount
                      }
                    }
                  }
                }
              }
            `;

            const res = await github.graphql(query, { owner, repo });
            const issues = res.repository.issues.nodes;

            for (const issue of issues) {
              const inProject = issue.projectItems.totalCount > 0;
              const hasLabel = issue.labels.nodes.some(l => l.name === 'in-project');

              if (inProject && !hasLabel) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issue.number,
                  labels: ['in-project']
                });
              } else if (!inProject && hasLabel) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issue.number,
                  name: 'in-project'
                });
              }
            }

      # Step 2: Run the stale action, ignoring issues with the 'in-project' label
      - name: Process Stale Issues
        uses: actions/stale@v9
        with:
          # Exempt all issues attached to a project
          exempt-issue-labels: 'in-project'

          # Inactivity timers
          days-before-issue-stale: 14
          stale-issue-message: >
            This issue has been inactive for 14 days and has been marked as stale.
            If no further activity occurs, it will be automatically closed.

          days-before-issue-close: 46
          close-issue-message: >
            This issue was automatically closed as not planned due to inactivity.
          close-issue-reason: 'not_planned'

          # Disable PR processing
          days-before-pr-stale: -1
          days-before-pr-close: -1
